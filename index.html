<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="author" content="Михаил Пирогов, PirogovLab">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#18204a">
<meta name="description" content="Марий мут — угадай марийское слово за 6 попыток. Задача дня, практика, карточки слов с переводом.">
<title>Марий мут — угадай марийское слово</title>
<link rel="icon" href="img/icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="top">
    <button class="ib" id="bMenu" aria-label="Как играть">?</button>
    <button class="ib" id="bSound" aria-label="Звук">🔊</button>
    <div id="logo"><i class="orn"></i><b>Марий мут</b><small>угадай марийское слово</small></div>
    <button class="ib" id="bLeaders" aria-label="Лидеры">🏆</button>
    <button class="ib" id="bStats" aria-label="Статистика">📊</button>
    <button class="ib" id="bSettings" aria-label="Настройки">⚙️</button>
  </header>
  <nav id="modes">
    <div class="seg" id="segMode"><button data-mode="daily" class="on">☀️ Задача дня</button><button data-mode="free">♾️ Практика</button></div>
    <button class="chip" id="bLen"><b>5</b> букв ▾</button>
  </nav>
  <div id="sub"></div>
  <main id="board"><div id="grid"></div></main>
  <div id="msg" aria-live="polite"></div>
  <div id="actions">
    <button class="act" id="bHint" hidden>🎬 Открыть букву</button>
    <button class="act gold" id="bNext" hidden>Новое слово ›</button>
    <button class="act" id="bCardAgain" hidden>📖 Карточка слова</button>
    <button class="act blue" id="bShare" hidden>📤 Поделиться</button>
  </div>
  <div id="kb"></div>
  <div id="kbHint">⌨️ Можно печатать с клавиатуры · <b>1</b> Ӓ · <b>2</b> Ӧ · <b>3</b> Ӱ · <b>4</b> Ӹ · <b>5</b> Ҥ · Enter — проверить</div>
  <footer id="foot"><span id="brand">PirogovLab · Михаил Пирогов</span></footer>
</div>
<div id="modal" hidden><div id="sheet"></div></div>
<div id="toast"></div>
<canvas id="fx"></canvas>
<div id="tut" hidden><div id="tutHole"></div><div id="tutBox"><div id="tutText"></div><div class="tutBtns"><button id="tutSkip">Пропустить</button><button id="tutNext">Далее</button></div></div></div>
<script src="data/words.js"></script>
<script src="data/cards.js"></script>
<script src="js/platform.js"></script>
<script src="js/sound.js"></script>
<script src="js/lb.js"></script>
<script src="js/app.js"></script>
</body>
</html>
