# Марий Wordle: общая таблица лидеров — один PHP-скрипт (остальной сайт статичен)
location = /api/mari-wordle/ {
	client_max_body_size 16k;
	include fastcgi_params;
	fastcgi_param SCRIPT_FILENAME $document_root/api/mari-wordle/index.php;
	fastcgi_pass unix:/run/php/php8.1-fpm.sock;
}
# никаких других файлов под /api/mari-wordle/ (исходник index.php не отдаётся)
location ^~ /api/mari-wordle/ {
	return 404;
}
